[package]
authors     = { workspace = true }
description = "Abstract Interchain Account (ICA) Types"
edition     = { workspace = true }
license     = { workspace = true }
name        = "abstract-ica"
readme      = "README.md"
repository  = "https://github.com/AbstractSDK/abstract"
version     = { workspace = true }

[features]
# for quicker tests, cargo test --lib

[dependencies]

abstract-sdk = { workspace = true }
cosmwasm-schema = { workspace = true }
cosmwasm-std    = { workspace = true, features = ["iterator"] }
cw-orch      = { workspace = true }
cw-ownable      = { workspace = true }
map-macro       = "0.3.0"

# EVM
polytone-evm = { git = "https://github.com/permissionlessweb/polytone", branch = "evm/zk-mvp" }

[dev-dependencies]
abstract-testing = { path = "../abstract-testing" }
anyhow           = { workspace = true }
coverage-helper  = { workspace = true }
cw20-base        = { workspace = true }
rstest           = { workspace = true }

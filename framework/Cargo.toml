[workspace]
members = [
    "contracts/account/",
    "contracts/native/*",
    "packages/abstract-*",
    "packages/standards/*",
]

# Enable the version 2 feature resolver, which avoids unifying features for targets that are not being built
#
# Critically this prevents dev-dependencies from enabling features even when not building a target that
# uses dev-dependencies, e.g. the library crate. This in turn ensures that we can catch invalid feature
# flag combinations that would otherwise only surface in dependent crates
#
# Reference - https://doc.rust-lang.org/nightly/cargo/reference/features.html#feature-resolver-version-2
# See - https://github.com/apache/arrow-rs/pull/1822/files
resolver = "2"

[workspace.package]
authors = [
    "CyberHoward <cyberhoward@protonmail.com>",
    "Riada <riada@abstract.money>",
    "Abstract Money <contact@abstract.money>",
]
documentation = "https://docs.abstract.money/"
edition = "2021"
homepage = "https://abstract.money"
keywords = ["cosmos", "cosmwasm", "framework"]
license = "LGPL-3.0"
repository = "https://github.com/AbstractSDK/abstract"
version = "0.26.1"

[workspace.dependencies]

abstract-account = { path = "contracts/account", default-features = false }
## crates in order of publishing ## see docs/Publishing.md

abstract-adapter    = { path = "packages/abstract-adapter", version = "0.26.1" }
abstract-adapter-utils    = { version = "0.26.1", path = "packages/standards/utils" }
abstract-app        = { path = "packages/abstract-app", version = "0.26.1" }
abstract-dex-standard     = { path = "packages/standards/dex" }

abstract-ica     = { version = "0.26.1", path = "packages/abstract-ica" }
abstract-integration-tests = { path = "packages/abstract-integration-tests" }

# Keep these as path, creates cirular dependency otherwise
# Only need to re-publish all contracts if a re-publish of abstract-interface is required
abstract-interface = { path = "packages/abstract-interface" }

# These should remain fixed and don't need to be re-published (unless changes are made)
abstract-macros = { version = "0.26.1", path = "packages/abstract-macros" }
abstract-sdk     = { version = "0.26.1", path = "packages/abstract-sdk" }
abstract-staking-standard = { path = "packages/standards/staking" }
abstract-standalone = { path = "packages/abstract-standalone", version = "0.26.1" }
abstract-std = { path = "packages/abstract-std" }
abstract-testing = { version = "0.26.1", path = "packages/abstract-testing" }
abstract-xion = { package = "xion-account", git = "https://github.com/permissionlessweb/contracts", branch = "zk-mvp", features = ["library"] }
ans-host           = { package = "abstract-ans-host", path = "contracts/native/ans-host" }
anybuf    = { version = "1.0.0" }

## Testing
anyhow          = "1"
clap               = { version = "4.0.32", features = ["derive"] }
cosmos-sdk-proto = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "zk-mvp" }
cosmrs = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "zk-mvp" }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
coverage-helper = { version = "0.2.2" }
cw-address-like = { git = "https://github.com/permissionlessweb/cw-plus-plus", branch = "zk-mvp" }
cw-asset = { git = "https://github.com/permissionlessweb/cw-asset", branch = "zk-mvp" }
cw-blob = { git = "https://github.com/permissionlessweb/cw-packages", branch = "zk-mvp" }
cw-clearable = { git = "https://github.com/permissionlessweb/cw-packages", branch = "zk-mvp" }
cw-controllers = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-orch-interchain = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-orch-polytone = { package = "abstract-cw-orch-polytone", git = "https://github.com/permissionlessweb/polytone", branch = "zk-mvp" }
cw-ownable = { git = "https://github.com/permissionlessweb/cw-plus-plus", branch = "zk-mvp" }
cw-plus-interface = { package = "cw-plus-orch", git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "zk-mvp" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw2 = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw20 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw20-base = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
ibc-proto = { git = "https://github.com/permissionlessweb/ibc-proto-rs", branch = "zk-mvp" }

# Ibc
ibc-client = { package = "abstract-ibc-client", path = "contracts/native/ibc-client" }
ibc-host   = { package = "abstract-ibc-host", path = "contracts/native/ibc-host" }
module-factory     = { package = "abstract-module-factory", path = "contracts/native/module-factory" }
polytone = { package = "abstract-polytone", git = "https://github.com/permissionlessweb/polytone", branch = "zk-mvp" }
polytone-note = { package = "abstract-polytone-note", git = "https://github.com/permissionlessweb/polytone", branch = "zk-mvp" }
protobuf  = { version = "2", features = ["with-bytes"] }
registry = { package = "abstract-registry", path = "contracts/native/registry" }
rstest          = "0.17.0"
schemars  = "0.8.22"
semver             = "1.0"
serde     = { version = "1.0", default-features = false, features = ["derive"] }

serde-cw-value  = "0.7.0"
thiserror = { version = "1.0.50" }
tokio              = { version = "1.4", features = ["full"] }

# Additional local forks (transitive deps)
abstract-cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "zk-mvp" }
abstract-polytone-proxy = { git = "https://github.com/permissionlessweb/polytone", branch = "zk-mvp" }
abstract-polytone-voice = { git = "https://github.com/permissionlessweb/polytone", branch = "zk-mvp" }
clone-cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "zk-mvp" }
cw-orch-core = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-orch-mock = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-orch-traits = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
neutron-std = { git = "https://github.com/permissionlessweb/neutron-std", branch = "zk-mvp" }
neutron-test-tube = { git = "https://github.com/permissionlessweb/neutron-test-tube", branch = "zk-mvp" }
osmosis-std = { git = "https://github.com/permissionlessweb/osmosis-rust", branch = "zk-mvp" }
osmosis-test-tube = { git = "https://github.com/permissionlessweb/osmosis-test-tube", branch = "zk-mvp" }
simple-ica = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "zk-mvp" }
simple-ica-controller = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "zk-mvp" }
simple-ica-host = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "zk-mvp" }
tendermint = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "zk-mvp" }
tendermint-proto = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "zk-mvp" }
tendermint-rpc = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "zk-mvp" }
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[patch.crates-io]

nam-blst = { git = "https://github.com/permissionlessweb/blst", branch = "zk-mvp" }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Backup release profile, will result in warnings during optimization
[profile.release]
codegen-units    = 1
debug            = false
debug-assertions = false
incremental      = false
lto              = true
opt-level        = 's'
overflow-checks  = true
panic            = 'abort'
rpath            = false

[workspace]
members = [
    "contracts/account/",
    "contracts/native/*",
    "packages/abstract-*",
    "packages/standards/*",
]

# Enable the version 2 feature resolver, which avoids unifying features for targets that are not being built
#
# Critically this prevents dev-dependencies from enabling features even when not building a target that
# uses dev-dependencies, e.g. the library crate. This in turn ensures that we can catch invalid feature
# flag combinations that would otherwise only surface in dependent crates
#
# Reference - https://doc.rust-lang.org/nightly/cargo/reference/features.html#feature-resolver-version-2
# See - https://github.com/apache/arrow-rs/pull/1822/files
resolver = "2"

[workspace.package]
authors = [
    "CyberHoward <cyberhoward@protonmail.com>",
    "Riada <riada@abstract.money>",
    "Abstract Money <contact@abstract.money>",
]
documentation = "https://docs.abstract.money/"
edition = "2021"
homepage = "https://abstract.money"
keywords = ["cosmos", "cosmwasm", "framework"]
license = "LGPL-3.0"
repository = "https://github.com/AbstractSDK/abstract"
version = "0.26.1"

[workspace.dependencies]

abstract-account = { path = "contracts/account", default-features = false }
## crates in order of publishing ## see docs/Publishing.md

abstract-adapter    = { path = "packages/abstract-adapter", version = "0.26.1" }
abstract-adapter-utils    = { version = "0.26.1", path = "packages/standards/utils" }
abstract-app        = { path = "packages/abstract-app", version = "0.26.1" }
abstract-dex-standard     = { path = "packages/standards/dex" }

abstract-ica     = { version = "0.26.1", path = "packages/abstract-ica" }
abstract-integration-tests = { path = "packages/abstract-integration-tests" }

# Keep these as path, creates cirular dependency otherwise
# Only need to re-publish all contracts if a re-publish of abstract-interface is required
abstract-interface = { path = "packages/abstract-interface" }

# These should remain fixed and don't need to be re-published (unless changes are made)
abstract-macros = { version = "0.26.1", path = "packages/abstract-macros" }
abstract-sdk     = { version = "0.26.1", path = "packages/abstract-sdk" }
abstract-staking-standard = { path = "packages/standards/staking" }
abstract-standalone = { path = "packages/abstract-standalone", version = "0.26.1" }
abstract-std     = { version = "0.26.1", path = "packages/abstract-std" }
abstract-testing = { version = "0.26.1", path = "packages/abstract-testing" }
abstract-xion    = { package = "xion-account", version = "=0.1.1", features = ["library"], path = "../../xion-account/contracts/account" }
ans-host           = { package = "abstract-ans-host", path = "contracts/native/ans-host" }
anybuf    = { version = "1.0.0" }

## Testing
anyhow          = "1"
clap               = { version = "4.0.32", features = ["derive"] }
cosmwasm-schema = { version = "3.0.4" }
cosmwasm-std    = { version = "3.0.4", features = ["cosmwasm_3_0"] }
coverage-helper = { version = "0.2.2" }
cw-address-like = { path = "../../cw-plus-plus/packages/address-like" }
cw-asset        = { path = "../../cw-asset" }
cw-blob = { features = ["library"], path = "../../cw-packages/contracts/cw-blob" }
cw-clearable    = { path = "../../cw-packages/cw-clearable" }
cw-controllers     = { path = "../../cw-minus/packages/controllers" }
cw-orch            = { path = "../../cw-orchestrator/cw-orch" }
cw-orch-interchain = { path = "../../cw-orchestrator/cw-orch-interchain" }
cw-orch-polytone = { package = "abstract-cw-orch-polytone", path = "../../polytone/packages/cw-orch-polytone" }
cw-ownable      = { path = "../../cw-plus-plus/packages/ownable" }
cw-storage-plus = { version = "3.0.1" }
cw-utils        = { path = "../../cw-minus/packages/cw-utils" }

cw2             = { path = "../../cw-minus/packages/cw2" }

cw20            = { path = "../../cw-plus/packages/cw20" }
cw20-base       = { path = "../../cw-plus/contracts/cw20-base" }

cosmos-sdk-proto = { path = "../../cosmos-rust/cosmos-sdk-proto", default-features = false }
cosmrs           = { path = "../../cosmos-rust/cosmrs" }
cw-plus-interface = { package = "cw-plus-orch", path = "../../cw-orchestrator/packages/integrations/cw-plus" }
ibc-proto        = { path = "../../ibc-proto-rs", default-features = false }

# Ibc
ibc-client = { package = "abstract-ibc-client", path = "contracts/native/ibc-client" }
ibc-host   = { package = "abstract-ibc-host", path = "contracts/native/ibc-host" }
module-factory     = { package = "abstract-module-factory", path = "contracts/native/module-factory" }
polytone         = { package = "abstract-polytone", path = "../../polytone/packages/polytone" }
polytone-note    = { package = "abstract-polytone-note", path = "../../polytone/contracts/main/note" }
protobuf  = { version = "2", features = ["with-bytes"] }
registry           = { package = "abstract-registry", path = "contracts/native/registry" }
rstest          = "0.17.0"
schemars  = "0.8.22"
semver             = "1.0"
serde     = { version = "1.0", default-features = false, features = ["derive"] }

serde-cw-value  = "0.7.0"
thiserror = { version = "1.0.50" }
tokio              = { version = "1.4", features = ["full"] }

# Additional local forks (transitive deps)
cw-orch-core     = { path = "../../cw-orchestrator/packages/cw-orch-core" }
cw-orch-mock     = { path = "../../cw-orchestrator/packages/cw-orch-mock" }
cw-orch-traits   = { path = "../../cw-orchestrator/packages/cw-orch-traits" }
tendermint       = { path = "../../tendermint-rs/tendermint" }
tendermint-proto = { path = "../../tendermint-rs/proto" }
tendermint-rpc   = { path = "../../tendermint-rs/rpc" }
abstract-cw-multi-test = { path = "../../cw-multi-test-fork" }
clone-cw-multi-test = { path = "../../clone-cw-multi-test" }
abstract-polytone-voice = { package = "abstract-polytone-voice", path = "../../polytone/contracts/main/voice" }
abstract-polytone-proxy = { package = "abstract-polytone-proxy", path = "../../polytone/contracts/main/proxy" }
osmosis-std = { path = "../../osmosis-rust/packages/osmosis-std" }
osmosis-test-tube = { path = "../../osmosis-test-tube/packages/osmosis-test-tube" }
neutron-std = { path = "../../neutron-std/packages/neutron-std" }
neutron-test-tube = { path = "../../neutron-test-tube/packages/neutron-test-tube" }
simple-ica = { path = "../../cw-ibc-demo/packages/simple-ica" }
simple-ica-controller = { path = "../../cw-ibc-demo/contracts/simple-ica-controller" }
simple-ica-host = { path = "../../cw-ibc-demo/contracts/simple-ica-host" }

[patch.crates-io]
nam-blst = { path = "../../nam-blst/bindings/rust" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Backup release profile, will result in warnings during optimization
[profile.release]
codegen-units    = 1
debug            = false
debug-assertions = false
incremental      = false
lto              = true
opt-level        = 's'
overflow-checks  = true
panic            = 'abort'
rpath            = false

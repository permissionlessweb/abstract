[workspace]
exclude = [
    "contracts/apps/croncat",
    "contracts/apps/dca",
    "contracts/standalones/ica-owner",
]
members = ["contracts/adapters/*", "contracts/apps/*", "contracts/standalones/*"]

resolver = "2"

[workspace.package]
authors = [
    "CyberHoward <cyberhoward@protonmail.com>",
    "Riada <riada@abstract.money>",
    "Abstract Money <contact@abstract.money>",
]
documentation = "https://docs.abstract.money/"
edition = "2021"
homepage = "https://abstract.money"
keywords = ["cosmos", "cosmwasm", "framework"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AbstractSDK/abstract"
version = "0.26.1"

[workspace.dependencies]
## crates in order of publishing ## see docs/Publishing.md

# abstract-adapter           = { version = "0.26.1" }
abstract-adapter    = { path = "../framework/packages/abstract-adapter", version = "0.26.1" }

abstract-adapter-utils         = { version = "0.26.1", path = "../framework/packages/standards/utils" }
abstract-app               = { path = "../framework/packages/abstract-app", version = "0.26.1" }

# Integrations
abstract-client            = { path = "../framework/packages/abstract-client", version = "0.26.1" }

## Modules
abstract-cw-staking  = { path = "./contracts/adapters/cw-staking", default-features = false }
abstract-dex-adapter = { path = "./contracts/adapters/dex", default-features = false }
abstract-dex-standard          = { path = "../framework/packages/standards/dex", version = "0.26.1" }
abstract-integration-tests = { path = "../framework/packages/abstract-integration-tests" }
abstract-interface         = { path = "../framework/packages/abstract-interface", version = "0.26.1" }
abstract-macros            = { path = "../framework/packages/abstract-macros", version = "0.26.1" }
# abstract-astrovault-adapter  = { path = "../integrations/astrovault-adapter", default-features = false }
# abstract-kujira-adapter      = { path = "../integrations/kujira-adapter", default-features = false }
abstract-money-market-standard = { path = "../framework/packages/standards/money-market", version = "0.26.1" }
abstract-neutron-dex-adapter = { path = "../integrations/neutron-dex-adapter", default-features = false }
abstract-osmosis-adapter     = { path = "../integrations/osmosis-adapter", default-features = false }
abstract-staking-standard      = { path = "../framework/packages/standards/staking", version = "0.26.1" }
abstract-standalone        = { path = "../framework/packages/abstract-standalone", version = "0.26.1" }
abstract-testing           = { path = "../framework/packages/abstract-testing", version = "0.26.1" }

## Testing
anyhow = "1"
challenge-app        = { path = "./contracts/apps/challenge", default-features = false }
chrono = { version = "0.4.31", default-features = false }
clap   = { version = "4.0.32", features = ["derive"] }

cosmwasm-schema = { version = "=4.1.0" }
cosmwasm-std = { version = "=4.1.0", features = ["cosmwasm_3_0"] }
croncat-app          = { path = "./contracts/apps/croncat", default-features = false }
cw-address-like = { version = "3.0.1" }
cw-asset        = { path = "../../cw-asset" }
cw-controllers = { version = "3.0.0" }
cw-orch = { version = "0.30.0" }
cw-orch-interchain = { version = "0.8.0" }
cw-orch-neutron-test-tube = { version = "=0.2.2" }
cw-orch-osmosis-test-tube = { version = "=0.5.1" }
cw-ownable = { version = "3.0.1" }
cw-plus-orch = { version = "0.25.0" }
cw-storage-plus = { version = "3.0.1" }
cw-utils = { version = "3.0.0" }
cw2 = { version = "3.0.0" }
cw20 = { version = "3.0.0" }
cw20-base = { version = "3.0.0", features = ["library"] }
dca-app              = { path = "./contracts/apps/dca", default-features = false }

protobuf  = { version = "2", features = ["with-bytes"] }
rstest = "0.17.0"
schemars  = { version = "0.8.22" }
semver = "1.0"
serde     = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.50" }
tokio                     = { version = "1.4", features = ["full"] }

# this ensures local compatability when compiling locally
[patch.crates-io]
abstract-adapter               = { path = "../framework/packages/abstract-adapter" }

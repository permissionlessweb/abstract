[workspace]
exclude = ["contracts/apps/croncat", "contracts/apps/dca"]
members = ["contracts/adapters/*", "contracts/apps/*", "contracts/standalones/*"]

resolver = "2"

[workspace.package]
authors = [
    "CyberHoward <cyberhoward@protonmail.com>",
    "Riada <riada@abstract.money>",
    "Abstract Money <contact@abstract.money>",
]
documentation = "https://docs.abstract.money/"
edition = "2021"
homepage = "https://abstract.money"
keywords = ["cosmos", "cosmwasm", "framework"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AbstractSDK/abstract"
version = "0.26.1"

[workspace.dependencies]
## crates in order of publishing ## see docs/Publishing.md

# abstract-adapter           = { version = "0.26.1" }
abstract-adapter    = { path = "../framework/packages/abstract-adapter" }

abstract-adapter-utils         = { path = "../framework/packages/standards/utils" }
abstract-app               = { path = "../framework/packages/abstract-app" }

# Integrations
abstract-astroport-adapter   = { path = "../integrations/astroport-adapter", default-features = false }
abstract-client            = { path = "../framework/packages/abstract-client" }

## Modules
abstract-cw-staking  = { path = "./contracts/adapters/cw-staking", default-features = false }
abstract-dex-adapter = { path = "./contracts/adapters/dex", default-features = false }
abstract-dex-standard          = { path = "../framework/packages/standards/dex" }
abstract-ibc-client = { path = "../framework/contracts/native/ibc-client", default-features = false }
abstract-integration-tests = { path = "../framework/packages/abstract-integration-tests" }
abstract-interface         = { path = "../framework/packages/abstract-interface" }
abstract-macros            = { path = "../framework/packages/abstract-macros" }
# abstract-astrovault-adapter  = { path = "../integrations/astrovault-adapter", default-features = false }
# abstract-kujira-adapter      = { path = "../integrations/kujira-adapter", default-features = false }
abstract-mars-adapter        = { path = "../integrations/mars-adapter", default-features = false }
abstract-money-market-standard = { path = "../framework/packages/standards/money-market" }
abstract-neutron-dex-adapter = { path = "../integrations/neutron-dex-adapter", default-features = false }
abstract-osmosis-adapter     = { path = "../integrations/osmosis-adapter", default-features = false }
abstract-staking-standard      = { path = "../framework/packages/standards/staking" }
abstract-standalone        = { path = "../framework/packages/abstract-standalone" }
abstract-testing           = { path = "../framework/packages/abstract-testing" }
abstract-wyndex-adapter      = { path = "../integrations/wyndex-adapter", default-features = false }

## Testing
anyhow = "1"
challenge-app        = { path = "./contracts/apps/challenge", default-features = false }
chrono = { version = "0.4.31", default-features = false }
clap   = { version = "4.0.32", features = ["derive"] }

cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp" }
croncat-app          = { path = "./contracts/apps/croncat", default-features = false }
cw-address-like = { git = "https://github.com/permissionlessweb/cw-plus-plus", branch = "feat/mvp" }
cw-asset = { git = "https://github.com/permissionlessweb/cw-asset", branch = "main" }
cw-controllers = { git = "https://github.com/permissionlessweb/cw-minus", branch = "main" }
cw-ica-controller = { path = "../../cw-ica-controller", default-features = false }
cw-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "cw3" }
cw-orch-interchain   = { path = "../../cw-orchestrator/cw-orch-interchain" }
cw-orch-neutron-test-tube = { path = "../../cw-orchestrator/packages/cw-orch-neutron-test-tube" }
cw-orch-osmosis-test-tube = { path = "../../cw-orchestrator/packages/cw-orch-osmosis-test-tube" }
cw-orch-polytone = { package = "abstract-cw-orch-polytone", git = "https://github.com/permissionlessweb/polytone", branch = "bump/cw3" }
cw-ownable = { git = "https://github.com/permissionlessweb/cw-plus-plus", branch = "feat/mvp" }
cw-plus-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "cw3" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "mvp" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", branch = "main" }
cw2 = { git = "https://github.com/permissionlessweb/cw-minus", branch = "main" }
cw20 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "main" }
cw20-base = { git = "https://github.com/permissionlessweb/cw-plus", branch = "main" }
dca-app              = { path = "./contracts/apps/dca", default-features = false }

mockdex-bundle = { path = "../integrations/bundles/mockdex" }
neutron-std = { git = "https://github.com/permissionlessweb/neutron-std", branch = "feat/cw3" }
osmosis-std = { git = "https://github.com/permissionlessweb/osmosis-rust", branch = "cw3" }
protobuf  = { version = "2", features = ["with-bytes"] }
rstest = "0.17.0"
schemars  = { version = "0.8.22" }
semver = "1.0"
serde     = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.50" }
tokio                     = { version = "1.4", features = ["full"] }
abstract-std = { path = "../framework/packages/abstract-std" }
abstract-sdk = { path = "../framework/packages/abstract-sdk" }
cw-orch-core = { path = "../../cw-orchestrator/packages/cw-orch-core" }
cw-orch-mock = { path = "../../cw-orchestrator/packages/cw-orch-mock" }
cw-orch-traits = { path = "../../cw-orchestrator/packages/cw-orch-traits" }
cosmrs = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "main" }
cosmos-sdk-proto = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "main" }
ibc-proto = { git = "https://github.com/permissionlessweb/ibc-proto-rs", branch = "main" }
tendermint = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "main" }
tendermint-proto = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "main" }
tendermint-rpc = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "main" }
abstract-cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "bump/cw3/official-ibc-fork" }
clone-cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "cw3/adapt_for_local_execution" }
abstract-polytone = { git = "https://github.com/permissionlessweb/polytone", branch = "bump/cw3" }
abstract-polytone-note = { git = "https://github.com/permissionlessweb/polytone", branch = "bump/cw3" }
abstract-polytone-voice = { git = "https://github.com/permissionlessweb/polytone", branch = "bump/cw3" }
abstract-polytone-proxy = { git = "https://github.com/permissionlessweb/polytone", branch = "bump/cw3" }
abstract-cw-orch-polytone = { git = "https://github.com/permissionlessweb/polytone", branch = "bump/cw3" }
osmosis-test-tube = { git = "https://github.com/permissionlessweb/osmosis-test-tube", branch = "cw3" }
neutron-test-tube = { git = "https://github.com/permissionlessweb/neutron-test-tube", branch = "dev" }
simple-ica = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "cosmwasm3" }
simple-ica-controller = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "cosmwasm3" }
simple-ica-host = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "cosmwasm3" }

# Backup release profile, will result in warnings during optimization
[patch.crates-io]

# Fork patches (managed by dep-switch.py)

# Fork patches (managed by dep-switch.py)
nam-blst = { git = "https://github.com/permissionlessweb/blst", branch = "main" }
[profile.release]
codegen-units    = 1
debug            = false
debug-assertions = false
incremental      = false
lto              = true
opt-level        = 3
overflow-checks  = true
panic            = 'abort'
rpath            = false

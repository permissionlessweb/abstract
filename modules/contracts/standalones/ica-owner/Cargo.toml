[package]
authors       = []
documentation = ""
edition       = "2021"
homepage      = ""
keywords      = ["cosmos", "cosmwasm", "abstractsdk"]
license       = "GPL-3.0-or-later"
name          = "my-standalone"
repository    = ""
resolver      = "2"
version       = "0.0.1"

exclude = ["contract.wasm", "hash.txt"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name              = "publish"
required-features = ["daemon-bin"]

[features]
daemon-bin = [
    "cw-orch/daemon",
    "dep:clap",
    "dep:abstract-client",
    "dep:dotenv",
    "dep:env_logger",
]
default    = ["export"]
export     = []

[dependencies]

# Dependencies for bins
abstract-client = { workspace = true, optional = true }

# Dependencies for interface
abstract-interface = { workspace = true }
abstract-standalone = { workspace = true }
clap            = { workspace = true, optional = true, features = ["derive"] }
const_format        = { version = "0.2.32" }
cosmwasm-schema     = { workspace = true }
cosmwasm-std        = { workspace = true }
cw-asset            = { workspace = true }
cw-controllers      = { workspace = true }

# ICA controller
cw-ica-controller = { workspace = true, features = ["query"] }
cw-orch            = { workspace = true }
cw-storage-plus     = { workspace = true }
dotenv          = { version = "0.15.0", optional = true }
env_logger      = { version = "0.11.3", optional = true }
thiserror           = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cw-ica-controller = { workspace = true, features = ["export"] }

[dev-dependencies]
abstract-client     = { workspace = true }
abstract-standalone = { workspace = true, features = ["test-utils"] }
cw-orch             = { workspace = true, features = ["daemon"] }
cw-orch-interchain  = { workspace = true, features = ["daemon"] }
env_logger          = { version = "0.11.3" }
my-standalone       = { path = "." }

[[test]]
name = "starship"
test = false

[workspace]
members = [
    # "astroport-adapter",
    #"astrovault-adapter",
    "bundles/*",
    #"kujira-adapter",
    # "mars-adapter",
    "neutron-dex-adapter",
    "osmosis-adapter",
    "wyndex-adapter",
]

resolver = "2"

[workspace.package]
authors = [
    "CyberHoward <cyberhoward@protonmail.com>",
    "Riada <riada@abstract.money>",
    "Abstract Money <contact@abstract.money>",
]
documentation = "https://docs.abstract.money/"
edition = "2021"
homepage = "https://abstract.money"
keywords = ["cosmos", "cosmwasm", "framework"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AbstractSDK/abstract"
version = "0.26.1"

[workspace.dependencies]
## crates in order of publishing ## see docs/Publishing.md
abstract-adapter = { path = "../framework/packages/abstract-adapter" }
abstract-adapter-utils = { path = "../framework/packages/standards/utils" }
abstract-dex-standard = { path = "../framework/packages/standards/dex" }
abstract-interface = { path = "../framework/packages/abstract-interface" }
abstract-money-market-standard = { path = "../framework/packages/standards/money-market" }
abstract-sdk = { path = "../framework/packages/abstract-sdk" }
abstract-staking-standard = { path = "../framework/packages/standards/staking" }
abstract-std = { path = "../framework/packages/abstract-std" }
anyhow = "1.0"
chrono = { version = "0.4.31", default-features = false }
clap = { version = "4.0.32", features = ["derive"] }
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp" }
cw-address-like = { git = "https://github.com/permissionlessweb/cw-plus-plus", branch = "zk-mvp" }
cw-asset = { git = "https://github.com/permissionlessweb/cw-asset", branch = "zk-mvp" }
cw-controllers = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-ownable = { git = "https://github.com/permissionlessweb/cw-plus-plus", branch = "zk-mvp" }
cw-plus-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", branch = "zk-mvp" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw2 = { git = "https://github.com/permissionlessweb/cw-minus", branch = "zk-mvp" }
cw20 = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
cw20-base = { git = "https://github.com/permissionlessweb/cw-plus", branch = "zk-mvp" }
neutron-std = { git = "https://github.com/permissionlessweb/neutron-std", branch = "zk-mvp" }
osmosis-std = { git = "https://github.com/permissionlessweb/osmosis-rust", branch = "zk-mvp" }
protobuf = { version = "2", features = ["with-bytes"] }
schemars = { version = "0.8.22" }
semver = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.50" }
wyndex = { git = "https://github.com/permissionlessweb/wynddex", branch = "zk-mvp" }
wyndex-factory = { git = "https://github.com/permissionlessweb/wynddex", branch = "zk-mvp" }
wyndex-multi-hop = { git = "https://github.com/permissionlessweb/wynddex", branch = "zk-mvp" }
wyndex-pair = { git = "https://github.com/permissionlessweb/wynddex", branch = "zk-mvp" }
wyndex-stake = { git = "https://github.com/permissionlessweb/wynddex", branch = "zk-mvp" }
cw-orch-core = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-orch-mock = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cw-orch-traits = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "zk-mvp" }
cosmrs = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "zk-mvp" }
cosmos-sdk-proto = { git = "https://github.com/permissionlessweb/cosmos-rust", branch = "zk-mvp" }
ibc-proto = { git = "https://github.com/permissionlessweb/ibc-proto-rs", branch = "zk-mvp" }
tendermint = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "zk-mvp" }
tendermint-proto = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "zk-mvp" }
tendermint-rpc = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "zk-mvp" }
abstract-cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "zk-mvp" }
clone-cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "zk-mvp" }
abstract-polytone = { git = "https://github.com/permissionlessweb/polytone", branch = "zk-mvp" }
abstract-polytone-note = { git = "https://github.com/permissionlessweb/polytone", branch = "zk-mvp" }
abstract-polytone-voice = { git = "https://github.com/permissionlessweb/polytone", branch = "zk-mvp" }
abstract-polytone-proxy = { git = "https://github.com/permissionlessweb/polytone", branch = "zk-mvp" }
abstract-cw-orch-polytone = { git = "https://github.com/permissionlessweb/polytone", branch = "zk-mvp" }
osmosis-test-tube = { git = "https://github.com/permissionlessweb/osmosis-test-tube", branch = "zk-mvp" }
neutron-test-tube = { git = "https://github.com/permissionlessweb/neutron-test-tube", branch = "zk-mvp" }
simple-ica = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "zk-mvp" }
simple-ica-controller = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "zk-mvp" }
simple-ica-host = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "zk-mvp" }

# Backup release profile, will result in warnings during optimization
[patch.crates-io]




















nam-blst = { git = "https://github.com/permissionlessweb/blst", branch = "zk-mvp" }
[profile.release]
codegen-units    = 1
debug            = false
debug-assertions = false
incremental      = false
lto              = true
opt-level        = 3
overflow-checks  = true
panic            = 'abort'
rpath            = false

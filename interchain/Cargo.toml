# cw-address-like = { version = "2.0" }
# cw-asset        = { version = "4.0" }
# cw-ownable      = { version = "2.0" }

abstract-macros = { path = "../framework/packages/abstract-macros" }
abstract-adapter-utils = { path = "../framework/packages/standards/utils" }
abstract-dex-standard = { path = "../framework/packages/standards/dex" }
abstract-staking-standard = { path = "../framework/packages/standards/staking" }
abstract-money-market-standard = { path = "../framework/packages/standards/money-market" }
cw-orch-mock = { path = "../../cw-orchestrator/packages/cw-orch-mock" }
cw-orch-traits = { path = "../../cw-orchestrator/packages/cw-orch-traits" }
cw-plus-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", branch = "main" }
ibc-proto = { git = "https://github.com/permissionlessweb/ibc-proto-rs", branch = "main" }
tendermint = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "main" }
tendermint-proto = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "main" }
tendermint-rpc = { git = "https://github.com/permissionlessweb/tendermint-rs", branch = "main" }
abstract-cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "bump/cw3/official-ibc-fork" }
clone-cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test-fork", branch = "cw3/adapt_for_local_execution" }

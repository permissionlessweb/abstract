abstract-polytone-proxy = { git = "https://github.com/permissionlessweb/polytone", branch = "bump/cw3" }
osmosis-std = { git = "https://github.com/permissionlessweb/osmosis-rust", branch = "main" }
osmosis-test-tube = { git = "https://github.com/permissionlessweb/osmosis-test-tube", branch = "main" }
neutron-std = { git = "https://github.com/permissionlessweb/neutron-std", branch = "feat/cw3" }
neutron-test-tube = { git = "https://github.com/permissionlessweb/neutron-test-tube", branch = "main" }
simple-ica = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "cosmwasm3" }
simple-ica-controller = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "cosmwasm3" }
simple-ica-host = { git = "https://github.com/permissionlessweb/cw-ibc-demo", branch = "cosmwasm3" }

protobuf  = { version = "2", features = ["with-bytes"] }
rstest = "0.17.0"
schemars  = { version = "0.8.22" }
semver = "1.0"
serde     = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.49" }
tokio  = { version = "1.33.0", features = ["full"] }

# Backup release profile, will result in warnings during optimization
[patch.crates-io]
nam-blst = { path = "../../nam-blst/bindings/rust" }

# Fork patches (managed by dep-switch.py)
cosmwasm-vm = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp" }
[profile.release]
codegen-units    = 1
debug            = false
debug-assertions = false
incremental      = false
lto              = true
opt-level        = 3
overflow-checks  = true
panic            = 'abort'
rpath            = false
